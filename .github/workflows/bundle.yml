name: bundle

# One ordered chain:
#
#   verify (3 OS)        fmt, clippy, tests, plus one rendered card per platform
#     └─ identical-bytes three platforms must agree on every byte
#          └─ assets     regenerate gallery + specimens; commit on main,
#                        fail the diff on pull requests
#               └─ action (3 OS)   the composite action itself, via `uses: ./`
#                    └─ build (6)  release archives, only outside pull requests
#                         └─ publish   tag, archives, and the generated assets

on:
  push:
    branches: [master]
    paths-ignore:
      - "assets/examples/**"
      - "assets/fonts/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Render one card per platform
        run: cargo run --quiet -- render examples/bench.jsonl -o target/bench.svg

      - uses: actions/upload-artifact@v4
        with:
          name: bench-svg-${{ matrix.os }}
          path: target/bench.svg
          if-no-files-found: error

  identical-bytes:
    name: identical bytes across platforms
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-svg-*
          merge-multiple: true
          path: artifacts
      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.svg
          files=(*.svg)
          for file in "${files[@]:1}"; do
            cmp "${files[0]}" "$file"
          done

  # Generated assets are part of the repository, so this stage is a gate:
  # on a pull request the regenerated bytes must equal the committed ones;
  # on main the fresh bytes are committed back (with [skip ci]) and handed to
  # the release.
  assets:
    name: generate assets
    needs: [verify, identical-bytes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate gallery and specimens
        run: |
          cargo run --example gallery
          cargo run --example specimen

      - name: Generated bytes must match the committed ones
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --exit-code -- assets/examples assets/fonts

      - name: Commit assets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/examples assets/fonts; then
            echo "assets already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/examples assets/fonts
          git commit -m "chore(assets): regenerate gallery and type specimens for ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep $((attempt * 3))
          done

      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: |
            assets/examples/*.svg
            assets/fonts/*.svg
          if-no-files-found: error

  # The action is the product: install script, render script, inputs and outputs.
  # `tool_path` points at the binary this job just built, so the release download
  # path does not need to exist yet.
  action:
    name: action (${{ matrix.os }})
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build

      - name: bench-svg action
        id: bench
        uses: ./
        with:
          input: examples/bench.jsonl
          format: benchmark_test
          out: target/action.svg
          tool_path: target/debug/bench-svg${{ runner.os == 'Windows' && '.exe' || '' }}
          version: auto

      - name: Check the output
        shell: bash
        run: |
          set -euo pipefail
          test -s target/action.svg
          test "${{ steps.bench.outputs.bytes }}" -gt 1000
          grep -q '<svg' target/action.svg
          echo "action rendered ${{ steps.bench.outputs.bytes }} bytes"

  # Everything below only runs outside pull requests.
  build:
    name: build ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    needs: action
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          archive="bench-svg-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" "bench-svg${ext}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          test -s "$archive"

      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "bench-svg-*.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-svg-${{ matrix.target }}
          path: |
            bench-svg-*.tar.gz
            bench-svg-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish
    if: github.event_name != 'pull_request'
    needs: [build, assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bench-svg-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: examples
          path: assets

      - name: Checksums and asset bundle
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cd ..
          tar -czf dist/bench-svg-assets.tar.gz -C . assets/examples assets/fonts
          ls -l dist

      # Date + commit, never a semantic version: `v2026.10.19-cd5cd87`.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists for this commit"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "bench-svg $tag" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
          echo "::notice::released $tag"
