name: bundle

# One chain, sized to the change:
#
#   full        Rust sources, manifests, the toolchain or .gitattributes
#               changed: verify on 3 OS, byte identity, assets, the action test,
#               then (outside pull requests) a 6-target release build + publish.
#   assets      only fonts/, assets/, sources/ or example data changed:
#               regenerate the gallery, specimens and source cards, then refresh
#               fonts-latest and the wiki (on pushes). Fonts are data, not compiled in.
#   action      only scripts/, action.yml, templates/ or the workflow changed:
#               run the action test only and stop.
#   docs        markdown/LICENSE/.gitignore only: nothing to do.
#
# After the assets job, a `font-archive` job on pushes refreshes the rolling
# fonts-latest release with benchcat-fonts.7z, and a `wiki` job refreshes the
# repository's Fonts and Sources wiki pages.
#
# A `consumer` job after publish uses the action by reference (not `uses: ./`)
# and installs the freshly published binary, which is the only way to exercise
# the composite-action download path.
# Mixed changes run the union (full implies assets and action). Anything the
# classifier does not recognise falls back to `full`, so a new top-level file
# can never silently skip the build.

on:
  push:
    branches: [master]
    paths-ignore:
      - "assets/examples/**"
      - "assets/fonts/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR runs are superseded by the next push; master runs must finish so a release
# is never cancelled halfway through.
concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The toolchain is pinned in the four `toolchain:` inputs (1.99.0) so a stable
# channel bump cannot change the bytes we test, commit and release. Bump them
# together with Cargo.toml's rust-version when the MSRV moves.
env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      binary: ${{ steps.classify.outputs.binary }}
      assets: ${{ steps.classify.outputs.assets }}
      action: ${{ steps.classify.outputs.action }}
    steps:
      - uses: actions/checkout@v7
        with:
          # push needs the pushed range; pull requests need the merge base.
          fetch-depth: 0
      - name: Wiki page generator
        shell: bash
        env:
          WIKI_SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
          WIKI_ALLOW_MISSING: "1"
        run: |
          set -euo pipefail
          # Dry-run only: no token, no clone. Specimens may not have been
          # regenerated yet, so the pre-assets check allows missing ones.
          WIKI_DRY_RUN=1 WIKI_OUT="$RUNNER_TEMP/Fonts.md" bash scripts/wiki-fonts.sh
          WIKI_DRY_RUN=1 WIKI_ALLOW_MISSING=1 WIKI_OUT="$RUNNER_TEMP/Sources.md" bash scripts/wiki-sources.sh

      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          binary=true
          assets=true
          action=true

          # Only Rust example sources are build inputs. Data under examples/
          # (gallery inputs, rows.toml, criterion fixtures) only needs assets.
          rust='^(Cargo\.toml|Cargo\.lock|build\.rs|src/|crates/.*\.rs$|crates/.*\.pest$|crates/.*/Cargo\.toml$|crates/.*/build\.rs$|examples/.*\.rs$|sources/.*\.oops$|\.cargo/|rust-toolchain|\.gitattributes$)'
          known='^(fonts/|assets/|.*\.md$|LICENSE|\.gitignore$|scripts/|action\.yml$|templates/|\.github/|examples/|crates/|sources/)'

          classify() {
            local from="$1" to="$2"
            if ! git diff --name-only "$from" "$to" >/tmp/changed 2>/dev/null; then
              echo "cannot diff $from..$to: full chain"
              return
            fi
            {
              echo "changed files:"
              sed 's/^/  /' /tmp/changed
            }
            if grep -Eq "$rust" /tmp/changed; then
              echo "Rust inputs changed: full chain"
            elif grep -Evq "$known" /tmp/changed; then
              echo "unrecognised paths: full chain (safe default)"
            else
              binary=false
              assets=false
              action=false
              if grep -Eq '^(fonts/|assets/|examples/|sources/|crates/benchcat/examples/)' /tmp/changed; then
                assets=true
              fi
              if grep -Eq '^(scripts/|action\.yml$|templates/|\.github/)' /tmp/changed; then
                action=true
              fi
              echo "binary=$binary assets=$assets action=$action"
            fi
          }

          case "${{ github.event_name }}" in
            push)
              before="${{ github.event.before }}"
              after="${{ github.sha }}"
              if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
                echo "no parent commit: full chain"
              else
                classify "$before" "$after"
              fi
              ;;
            pull_request)
              classify "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
              ;;
            *)
              echo "manual run: full chain"
              ;;
          esac

          # A binary change always regenerates assets and exercises the action.
          if [[ "$binary" == true ]]; then
            assets=true
            action=true
          fi
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.binary == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting and lints are OS independent; keep them off the slower runners.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        # --all-targets would also execute the development-only bench target.
        run: cargo test --locked --workspace --lib --bins --tests --examples

      - name: Render one card per platform
        shell: bash
        run: |
          # The CLI fills missing meta.commit/os/arch from GITHUB_SHA,
          # RUNNER_OS and RUNNER_ARCH, so each runner would embed its own
          # platform into the card. Unset them here: the byte comparison is
          # about the renderer being a pure function of the input, not about
          # suppressing provenance in normal runs.
          #
          # The two BENCHCAT_* variables are runtime knobs, not config fields:
          # keeping them set guards against the action's BENCHCAT_FONT_DIR
          # leaking into config-rs as an unknown `font_dir` key.
          env -u GITHUB_SHA -u RUNNER_OS -u RUNNER_ARCH \
            BENCHCAT_FONT_DIR=fonts \
            BENCHCAT_RELEASE_BASE=https://example.invalid \
            cargo run --locked --quiet -- render examples/bench.jsonl -o target/bench.svg

      - uses: actions/upload-artifact@v7
        with:
          # `card-` keeps these apart from the `benchcat-<target>` release
          # artifacts that other jobs may be uploading at the same time.
          name: card-${{ matrix.os }}
          path: target/bench.svg
          if-no-files-found: error
          retention-days: 7

  identical-bytes:
    name: identical bytes across platforms
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: card-*
          # NOT merge-multiple: every artifact contains a file named bench.svg.
          path: artifacts
      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          expected=3
          sha256sum artifacts/*/bench.svg
          files=(artifacts/*/bench.svg)
          if [[ ${#files[@]} -ne $expected ]]; then
            echo "::error::expected $expected rendered cards (one per OS), got ${#files[@]}"
            exit 1
          fi
          for file in "${files[@]:1}"; do
            cmp "${files[0]}" "$file"
          done

  # Generated assets are part of the repository, so this stage is a gate: on a
  # pull request the regenerated bytes must equal the committed ones; on main the
  # fresh bytes are committed back (with [skip ci]) and handed to the release.
  assets:
    name: generate assets
    needs: [changes, verify, identical-bytes]
    if: ${{ !cancelled() && needs.changes.outputs.assets == 'true' && (needs.changes.outputs.binary != 'true' || (needs.verify.result == 'success' && needs.identical-bytes.result == 'success')) }}
    timeout-minutes: 30
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2

      - name: Font licences
        shell: bash
        run: |
          set -euo pipefail
          for font in fonts/*.ttf fonts/*.otf; do
            [[ -e "$font" ]] || continue
            licence="${font%.*}-OFL.txt"
            if [[ ! -f "$licence" ]]; then
              echo "::error::missing $licence for $font"
              exit 1
            fi
            grep -q 'SIL OPEN FONT LICENSE' "$licence" || {
              echo "::error::$licence is not an OFL text"
              exit 1
            }
          done

      - name: Generate gallery, specimens and source cards
        run: |
          cargo run --locked --example gallery
          cargo run --locked --example specimen
          cargo run --locked --example sources

      - name: Generated bytes must match the committed ones
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changes=$(git status --porcelain -- assets/examples assets/fonts assets/sources)
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            git diff -- assets/examples assets/fonts assets/sources || true
            echo "::error::generated assets differ from the committed ones"
            exit 1
          fi

      - name: Commit assets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "branch" ]]; then
            echo "not on a branch; nothing to commit"
            exit 0
          fi
          changed() {
            [[ -n "$(git status --porcelain -- assets/examples assets/fonts assets/sources)" ]]
          }
          if ! changed; then
            echo "assets already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_assets() {
            git add -A -- assets/examples assets/fonts assets/sources
            git commit -m "chore(assets): regenerate gallery, type specimens and source cards for ${GITHUB_SHA::7} [skip ci]"
          }
          commit_assets
          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" 2>/dev/null &&
               git push origin "HEAD:$branch"; then
              exit 0
            fi
            # Someone pushed while we rendered: regenerate on top of their tree.
            git rebase --abort 2>/dev/null || true
            git reset --hard "origin/$branch"
            cargo run --locked --example gallery
            cargo run --locked --example specimen
            cargo run --locked --example sources
            if ! changed; then
              echo "the remote already has these assets"
              exit 0
            fi
            commit_assets
            sleep $((attempt * 3))
          done
          echo "::error::could not push the regenerated assets"
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: examples
          path: |
            assets/examples/*.svg
            assets/fonts/*.svg
            assets/sources/*.svg
            assets/sources/catalogue.json
          if-no-files-found: error
          retention-days: 7

  font-archive:
    name: package the font catalogue
    needs: [changes, assets]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.assets.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Includes specimens committed by the assets job.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full

      - name: Package fonts
        shell: bash
        run: |
          set -euo pipefail
          7z a -t7z -m0=lzma2 -mx=9 -mfb=273 -md=64m benchcat-fonts.7z fonts
          7z t benchcat-fonts.7z
          sha256sum benchcat-fonts.7z > benchcat-fonts.7z.sha256
          ls -lh benchcat-fonts.7z

      - name: Publish the rolling fonts release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=fonts-latest
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" --latest=false --prerelease \
              --title "benchcat fonts" \
              --notes "Rolling build of the OFL font catalogue from master. Not a binary release."
          else
            # Keep it out of /releases/latest: install.sh must keep resolving a
            # binary release even when fonts are newer than the last release.
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --latest=false --prerelease --title "benchcat fonts"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            benchcat-fonts.7z benchcat-fonts.7z.sha256 --clobber

  wiki:
    name: publish wiki pages
    needs: [changes, assets]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.assets.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The assets job may have committed new specimens after the push. Check
      # out the branch tip rather than GITHUB_SHA, or a newly added font would
      # be on the wiki's raw links but missing from the generated page.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update the wiki Fonts page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          WIKI_SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/wiki-fonts.sh

      - name: Update the wiki Sources page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          WIKI_SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/wiki-sources.sh

  # The action is the product: install script, render script, inputs and outputs.
  # It builds its own debug binary, so it runs in parallel with verify.
  action:
    name: action (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.action == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked

      - name: benchcat action
        id: bench
        uses: ./
        with:
          input: examples/bench.jsonl
          format: benchmark_test
          out: target/action.svg
          tool_path: target/debug/benchcat${{ runner.os == 'Windows' && '.exe' || '' }}
          version: auto

      - name: Check the output
        shell: bash
        run: |
          set -euo pipefail
          test -s target/action.svg
          test "${{ steps.bench.outputs.bytes }}" -gt 1000
          grep -q '<svg' target/action.svg
          echo "action rendered ${{ steps.bench.outputs.bytes }} bytes"

      # The action test above uses tool_path, so the download path is otherwise
      # untested. Exercise install.sh against the latest release on one runner.
      - name: Installer against the latest release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_ACTION_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(gh release list --repo "$GITHUB_ACTION_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases --limit 1)" ]]; then
            echo "no stable release in $GITHUB_ACTION_REPOSITORY yet; skipping"
            exit 0
          fi
          export INPUT_VERSION=latest
          export RUNNER_TOOL_CACHE="$RUNNER_TEMP/installer-check"
          bash scripts/install.sh
          bin="$RUNNER_TOOL_CACHE/benchcat/latest-x86_64-unknown-linux-musl/benchcat"
          "$bin" --version

  build:
    name: build ${{ matrix.target }}
    needs: [changes, verify, action]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.binary == 'true' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-1.99.0

      - name: Install musl toolchain
        if: ${{ contains(matrix.target, 'linux-musl') && matrix.cross != true }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          archive="benchcat-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" "benchcat${ext}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          test -s "$archive"

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "benchcat-*.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: benchcat-${{ matrix.target }}
          path: |
            benchcat-*.tar.gz
            benchcat-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [changes, build, assets]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.binary == 'true' }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    timeout-minutes: 30
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: benchcat-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: examples
          path: assets

      - name: Checksums and asset bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -czf dist/benchcat-assets.tar.gz -C . assets/examples assets/fonts assets/sources
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
          cd ..
          ls -l dist

      # A broken archive must never reach the release page.
      - name: Smoke-test the archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist-check
          tar -xzf dist/benchcat-x86_64-unknown-linux-musl.tar.gz -C /tmp/dist-check
          /tmp/dist-check/benchcat --version

      # Date + commit, never a semantic version: `v2026.10.19-cd5cd87`.
      - name: Publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A previous run may have died between creating the release and
            # uploading everything; refresh the assets instead of skipping.
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS --clobber
            echo "release $tag already existed; assets refreshed"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "benchcat $tag" \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS
          echo "::notice::released $tag"

      # Exercise the exact path a consumer uses: install.sh resolving the action
      # repository and verifying the release checksum.
      - name: Smoke-test the published binary
        shell: bash
        env:
          GITHUB_ACTION_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          [[ -n "$tag" ]] || { echo "::error::publish did not expose a tag"; exit 1; }
          export INPUT_VERSION="$tag"
          export RUNNER_TOOL_CACHE="$RUNNER_TEMP/benchcat-smoke"
          installed=false
          for attempt in 1 2 3 4 5; do
            if bash scripts/install.sh; then installed=true; break; fi
            sleep $((attempt * 5))
          done
          [[ "$installed" == true ]] || { echo "::error::installer did not succeed"; exit 1; }
          bin="$RUNNER_TOOL_CACHE/benchcat/$tag-x86_64-unknown-linux-musl/benchcat"
          "$bin" --version
          "$bin" render examples/bench.jsonl -o target/smoke.svg
          test -s target/smoke.svg
          echo "::notice::published binary installs and renders"

  # The composite action never sees GITHUB_ACTION_REPOSITORY inside its steps, so
  # `uses: ./` cannot catch repository-resolution bugs. This job consumes the
  # action exactly like a downstream repository does and installs the release
  # that this run just published.
  consumer:
    name: consume the published action (${{ matrix.os }})
    needs: [changes, publish]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.binary == 'true' && needs.publish.result == 'success' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is included on purpose: MSYS path handling broke checksum
        # verification there while Linux and macOS were fine.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Wait for the release asset
        shell: bash
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$TAG" ]] || { echo "::error::publish did not expose a tag"; exit 1; }
          case "$RUNNER_OS" in
            Windows) target=x86_64-pc-windows-msvc ;;
            *) target=x86_64-unknown-linux-musl ;;
          esac
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/benchcat-$target.tar.gz"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsI "$url" >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "::error::release asset did not become available"
          exit 1

      - name: Use the action as a consumer would
        uses: unk-404/benchcat@master
        with:
          input: examples/bench.jsonl
          format: benchmark_test
          out: target/consumer.svg

      - name: Check the rendered card
        shell: bash
        run: |
          set -euo pipefail
          test -s target/consumer.svg
          grep -q '<svg' target/consumer.svg
          echo "::notice::consumer installed the published action and rendered a card"
