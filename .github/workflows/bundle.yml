name: bundle

# One ordered chain:
#
#   verify (3 OS)        fmt, clippy, tests, plus one rendered card per platform
#     └─ identical-bytes three platforms must agree on every byte
#          └─ assets     regenerate gallery + specimens; commit on main,
#                        fail the diff on pull requests
#               └─ action (3 OS)   the composite action itself, via `uses: ./`
#                    └─ build (6)  release archives, only when binary inputs
#                                  changed and never on pull requests
#                         └─ publish   tag, archives, and the generated assets

on:
  push:
    branches: [master]
    paths-ignore:
      - "assets/examples/**"
      - "assets/fonts/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release builds are expensive (6 targets, attestations, a tag). Only run them
  # when something that can change the binary changed: manifests, Rust sources,
  # examples, cargo config or the toolchain pin. Scripts, action.yml, fonts,
  # templates, docs and assets are exercised by the other jobs and never need a
  # new release. A manual `workflow_dispatch` always builds.
  changes:
    name: detect binary changes
    runs-on: ubuntu-24.04
    outputs:
      binary: ${{ steps.diff.outputs.binary }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          set -euo pipefail
          binary=true
          pattern='^(Cargo\.toml|Cargo\.lock|build\.rs|src/|examples/|\.cargo/|rust-toolchain)'
          case "${{ github.event_name }}" in
            push)
              before="${{ github.event.before }}"
              after="${{ github.sha }}"
              if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
                echo "no parent commit: building"
              elif git diff --name-only "$before" "$after" >/dev/null 2>&1; then
                changed=$(git diff --name-only "$before" "$after")
                if grep -Eq "$pattern" <<<"$changed"; then
                  echo "binary inputs changed:"
                  grep -E "$pattern" <<<"$changed"
                else
                  binary=false
                  echo "no binary inputs changed; skipping the release build"
                fi
              else
                echo "cannot diff $before..$after: building"
              fi
              ;;
            *)
              echo "manual run or pull request: building"
              ;;
          esac
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Render one card per platform
        run: cargo run --quiet -- render examples/bench.jsonl -o target/bench.svg

      - uses: actions/upload-artifact@v7
        with:
          name: bench-svg-${{ matrix.os }}
          path: target/bench.svg
          if-no-files-found: error

  identical-bytes:
    name: identical bytes across platforms
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-svg-*
          merge-multiple: true
          path: artifacts
      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.svg
          files=(*.svg)
          for file in "${files[@]:1}"; do
            cmp "${files[0]}" "$file"
          done

  # Generated assets are part of the repository, so this stage is a gate:
  # on a pull request the regenerated bytes must equal the committed ones;
  # on main the fresh bytes are committed back (with [skip ci]) and handed to
  # the release.
  assets:
    name: generate assets
    needs: [verify, identical-bytes]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate gallery and specimens
        run: |
          cargo run --example gallery
          cargo run --example specimen

      - name: Generated bytes must match the committed ones
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --exit-code -- assets/examples assets/fonts

      - name: Commit assets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/examples assets/fonts; then
            echo "assets already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never merge here: a plain `git pull` would add
          # "Merge branch 'master' of ..." commits to the repository.
          git config pull.rebase true
          git config merge.ff only
          git add assets/examples assets/fonts
          git commit -m "chore(assets): regenerate gallery and type specimens for ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "::error::could not push the regenerated assets"
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: examples
          path: |
            assets/examples/*.svg
            assets/fonts/*.svg
          if-no-files-found: error

  # The action is the product: install script, render script, inputs and outputs.
  # `tool_path` points at the binary this job just built, so the release download
  # path does not need to exist yet.
  action:
    name: action (${{ matrix.os }})
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build

      - name: bench-svg action
        id: bench
        uses: ./
        with:
          input: examples/bench.jsonl
          format: benchmark_test
          out: target/action.svg
          tool_path: target/debug/bench-svg${{ runner.os == 'Windows' && '.exe' || '' }}
          version: auto

      - name: Check the output
        shell: bash
        run: |
          set -euo pipefail
          test -s target/action.svg
          test "${{ steps.bench.outputs.bytes }}" -gt 1000
          grep -q '<svg' target/action.svg
          echo "action rendered ${{ steps.bench.outputs.bytes }} bytes"

      # The action job above uses tool_path, so the download path is otherwise
      # untested. Exercise install.sh against the latest release on one runner.
      - name: Installer against the latest release
        if: runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_ACTION_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export INPUT_VERSION=latest
          export RUNNER_TOOL_CACHE="$RUNNER_TEMP/installer-check"
          bash scripts/install.sh
          bin="$RUNNER_TOOL_CACHE/bench-svg/latest-x86_64-unknown-linux-musl/bench-svg"
          "$bin" --version

  # Everything below only runs outside pull requests.
  build:
    name: build ${{ matrix.target }}
    needs: [changes, action]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.binary == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          archive="bench-svg-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" "bench-svg${ext}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          test -s "$archive"

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "bench-svg-*.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: bench-svg-${{ matrix.target }}
          path: |
            bench-svg-*.tar.gz
            bench-svg-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: [changes, build, assets]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.binary == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: bench-svg-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: examples
          path: assets

      - name: Checksums and asset bundle
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cd ..
          tar -czf dist/bench-svg-assets.tar.gz -C . assets/examples assets/fonts
          ls -l dist

      # Date + commit, never a semantic version: `v2026.10.19-cd5cd87`.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists for this commit"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "bench-svg $tag" \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS
          echo "::notice::released $tag"

      # Exercise the exact path a consumer uses: install.sh resolving the action
      # repository and verifying the release checksum.
      - name: Smoke-test the published binary
        shell: bash
        env:
          GITHUB_ACTION_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          export INPUT_VERSION="$tag"
          export RUNNER_TOOL_CACHE="$RUNNER_TEMP/bench-svg-smoke"
          sleep 5
          bash scripts/install.sh
          bin="$RUNNER_TOOL_CACHE/bench-svg/$tag-x86_64-unknown-linux-musl/bench-svg"
          "$bin" --version
          "$bin" render examples/bench.jsonl -o target/smoke.svg
          test -s target/smoke.svg
          echo "::notice::published binary installs and renders"
