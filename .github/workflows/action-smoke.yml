name: action-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Exercises the composite action end to end without publishing a release:
  # `tool-path` points at the freshly built debug binary.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build

      - name: bench-svg action
        id: bench
        uses: ./
        with:
          input: examples/bench.jsonl
          format: benchmark_test
          out: target/smoke.svg
          tool_path: target/debug/bench-svg${{ runner.os == 'Windows' && '.exe' || '' }}
          version: auto

      - name: Check the output
        shell: bash
        run: |
          set -euo pipefail
          test -s target/smoke.svg
          test "${{ steps.bench.outputs.bytes }}" -gt 1000
          grep -q '<svg' target/smoke.svg
          echo "rendered ${{ steps.bench.outputs.bytes }} bytes"
