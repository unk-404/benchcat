name: benchcat
description: Render benchmark results as a self-contained, pastel SVG card for a README
author: benchcat

branding:
  icon: bar-chart-2
  color: purple

inputs:
  input:
    description: Files or directories to render, separated by spaces or newlines (omit when the config defines [[series]])
    required: false
  format:
    description: auto, json, jsonl, csv, benchmark_test, criterion, hyperfine, go, phpbench, jmh, google, google-console, swift, techempower, androidx, benchmark-test-human, benchmark-test-benchmarkjs, benchmark-runner, benchmarkdotnet
    default: auto
  config:
    description: Path to benchcat.toml (auto-discovered in the working directory)
    required: false
  out:
    description: Output SVG path
    default: assets/benchmarks.svg
  font:
    description: One or more families from the bundled OFL catalogue, comma separated, e.g. "quicksand,zcool-kuaile"
    required: false
  font_file:
    description: Explicit TTF/OTF path for a custom face; the bundled catalogue needs no file
    required: false
  version:
    description: Release tag such as v2026.10.19-cd5cd87; "auto" follows the action ref or latest
    default: auto
  tool_path:
    description: Use an existing benchcat binary instead of downloading one
    required: false

outputs:
  svg:
    description: Path of the written SVG
    value: ${{ steps.render.outputs.svg }}
  bytes:
    description: Size of the SVG in bytes
    value: ${{ steps.render.outputs.bytes }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TOOL_PATH: ${{ inputs.tool_path }}

    - id: render
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/render.sh"
      env:
        INPUT_INPUT: ${{ inputs.input }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_FONT: ${{ inputs.font }}
        INPUT_FONT_FILE: ${{ inputs.font_file }}
