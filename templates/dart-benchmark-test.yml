# Dart `benchmark_test` → README SVG
#

name: benchmarks

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  benchmark-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1

      - name: Run the benchmarks
        run: |
          dart pub get
          dart test benchmark/io_benchmark.dart --reporter expanded > bench.txt
          grep '^{' bench.txt > bench.jsonl

      - uses: unk-404/benchcat@master
        with:
          input: bench.jsonl
          format: benchmark_test
          out: assets/benchmarks.svg

      - name: Commit when the chart changed
        run: |
          if git diff --quiet -- assets/benchmarks.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/benchmarks.svg
          git commit -m "chore(bench): refresh chart [skip ci]"
          git push
