# hyperfine → README SVG, with two platforms compared side by side
#

name: benchmarks

on:
  push:
    branches: [master]

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      - name: Measure
        run: |
          hyperfine --warmup 3 --runs 20 \
            --export-json "bench-${{ matrix.os }}.json" \
            './target/release/app --help' \
            './target/release/app --version'

      - uses: actions/upload-artifact@v7
        with:
          name: hyperfine-${{ matrix.os }}
          path: bench-*.json

  render:
    needs: measure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: hyperfine-*
          merge-multiple: true

      # One row per command, one bar per platform: the comparison layout.
      - uses: unk-404/benchcat@master
        with:
          input: bench-ubuntu-24.04.json bench-macos-14.json
          format: hyperfine
          out: assets/benchmarks.svg
          config: benchcat.toml   # declare [[series]] there
